<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="コケと ねこうさ">
<link rel="manifest" href="manifest.json">

<link rel="icon" href="icons/icon-192.png">

<title>コケと ねこうさひろば</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one tall card — HUD on top, the hand-drawn village scene, a big sell button under it. Single pastel look by choice. */
:root {
  --sky: #fdf6e9;        /* paper */
  --ink: #4a3b33;        /* crayon-brown line */
  --ink-soft: #8a776a;
  --grass: #cfe6a4;
  --strawberry: #ef5b6b;
  --butter: #ffe08a;
  --peach: #ffc9a8;
  --mint: #9fd9b4;
  --card: #fffdf7;
  --font-title: "Yusei Magic", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 500;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 20px;
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
h1 { font-family: var(--font-title); font-weight: 400; font-size: 1.7rem; margin: 0; letter-spacing: .04em; }
h1 { display: flex; align-items: center; gap: 2px; }
h1 .kk { color: #f0a04b; font-size: .82em; margin-right: .25em; }
h1 svg { width: 1.35em; height: 1.2em; margin-right: 2px; flex: none; }
h1 .ne { color: #e88aa6; } h1 .u { color: #7cb8e0; } h1 .h { color: #8cc46e; }
.hud { display: flex; gap: 5px; flex-wrap: wrap; }
.chip {
  display: flex; align-items: center; gap: 4px;
  background: var(--card); border: 2px solid var(--ink); border-radius: 999px;
  padding: 1px 8px 1px 3px; font-weight: 700; font-size: .95rem;
  font-variant-numeric: tabular-nums;
}
.chip svg { width: 21px; height: 21px; }
.chip.pop { animation: pop .35s ease; }
@keyframes pop { 50% { transform: scale(1.15); } }

.scene-wrap {
  position: relative; border: 2.5px solid var(--ink); border-radius: 22px; overflow: hidden;
  background: var(--grass); box-shadow: 0 4px 0 rgba(74,59,51,.18);
}
/* the village is two screens wide; it scrolls sideways inside the frame */
.scroller { overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; scrollbar-width: none; overscroll-behavior-x: contain; }
.scroller::-webkit-scrollbar { display: none; }
#scene { display: block; width: 500%; max-width: none; height: auto; touch-action: pan-x; }
.scene-wrap::before, .scene-wrap::after { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; z-index: 1; }
.scene-wrap::before { background: radial-gradient(110% 70% at 12% -5%, rgba(255,246,214,.38), rgba(255,246,214,0) 60%); }
.scene-wrap::after { box-shadow: inset 0 0 38px rgba(96,80,40,.18), inset 0 -14px 26px rgba(96,80,40,.07); }
.pan {
  z-index: 2;
  position: absolute; bottom: 10px; width: 40px; height: 40px; padding: 0; border-radius: 50%;
  background: var(--card); font-size: 1.2rem; line-height: 1; box-shadow: 0 2px 0 var(--ink); border-width: 2px;
}
.pan:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }
#panL { left: 10px; } #panR { right: 10px; }
@keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
#panR.nudge { animation: nudge 1.2s ease-in-out infinite; }
.tap { cursor: pointer; }
.tap:focus { outline: none; }
.tap:focus-visible > .focus-ring { stroke: #5b9bd5; stroke-width: 3; }
.hint {
  min-height: 2.6em; text-align: center; font-size: .98rem; line-height: 1.35;
  color: var(--ink); text-wrap: balance;
}
/* big picture buttons that stay at the bottom of the screen */
.actions {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
  position: sticky; bottom: 0; z-index: 5; background: var(--sky);
  padding: 8px 0 calc(10px + env(safe-area-inset-bottom, 0px)); margin-bottom: -10px;
  box-shadow: 0 -10px 12px -8px rgba(74,59,51,.12);
}
#decoBtn { background: var(--mint); }
#orderBtn { background: var(--peach); }
#questBtn { background: #fbe0e8; }
#trainBtn { background: #cfe6f5; }
.quest-list { display: flex; flex-direction: column; gap: 8px; text-align: left; }
.quest { display: grid; grid-template-columns: 46px 1fr auto; gap: 8px; align-items: center; background: #f7f3ea; border-radius: 14px; padding: 7px 10px; }
.quest.done { opacity: .6; }
.quest svg.face { width: 46px; height: 46px; }
.quest small { display: block; color: var(--ink-soft); font-size: .75rem; }
.quest b { display: block; font-size: .9rem; line-height: 1.3; }
.quest .bar { height: 7px; background: #e9dccb; border-radius: 4px; margin: 4px 0 2px; overflow: hidden; }
.quest .bar i { display: block; height: 100%; background: #9fdc8a; border-radius: 4px; }
.quest .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.quest .reward { font-weight: 700; font-size: .82rem; white-space: nowrap; }
.quest button { font-size: .8rem; padding: 5px 9px; border-radius: 11px; border-width: 2px; box-shadow: 0 2px 0 var(--ink); background: var(--strawberry); color: #fff; }
.quest .ok { font-size: 1.2rem; color: #5f9e4a; font-weight: 700; }
.quest.bonus { grid-template-columns: 46px 1fr auto; background: #fff1f4; }
.actions button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 5px; border-radius: 16px; font-size: .66rem; line-height: 1.1; letter-spacing: -.02em; white-space: nowrap; min-width: 0; }
.actions .ic { width: 36px; height: 36px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); display: grid; place-items: center; }
.actions .ic svg { width: 28px; height: 28px; }
.actions .badge { position: absolute; top: -7px; right: -3px; background: #ffd45e; color: var(--ink); text-shadow: none; font-size: .66rem; border: 2px solid var(--ink); border-radius: 999px; padding: 0 5px; line-height: 1.45; font-variant-numeric: tabular-nums; }
.actions .badge.ready { background: var(--strawberry); color: #fff; }
.orders { display: flex; flex-direction: column; gap: 6px; }
.orders h3 { margin: 0; font-family: var(--font-title); font-weight: 400; font-size: 1.05rem; }
.order {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center;
  background: var(--card); border: 2px solid var(--ink); border-radius: 16px; padding: 6px 10px;
}
.order svg.face { width: 44px; height: 44px; }
.order .who { font-weight: 700; font-size: .9rem; }
.order .want { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.order .want span { display: inline-flex; align-items: center; gap: 2px; font-size: .88rem; font-variant-numeric: tabular-nums; }
.order .want span.short { color: #c2475a; }
.order .want svg { width: 18px; height: 18px; }
.order .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.order .reward { font-weight: 700; font-size: .85rem; white-space: nowrap; }
.order button { font-size: .85rem; padding: 6px 10px; border-radius: 12px; border-width: 2px; box-shadow: 0 2px 0 var(--ink); }
.order .give { background: var(--strawberry); color: #fff; }
.order .skip { background: transparent; box-shadow: none; border: none; padding: 0 2px; font-size: .75rem; color: var(--ink-soft); text-decoration: underline; }
.order-wait { font-size: .85rem; color: var(--ink-soft); text-align: center; padding: 4px; }
.modebar {
  position: absolute; left: 10px; right: 10px; top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 6px 8px 6px 12px; font-weight: 700; font-size: .9rem; z-index: 3;
}
.modebar button { font-size: .85rem; padding: 5px 12px; border-radius: 10px; box-shadow: 0 2px 0 var(--ink); background: var(--butter); }
.deco-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.deco-item { background: #f7f3ea; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.deco-item svg { width: 48px; height: 40px; }
.deco-item small { color: var(--ink-soft); font-size: .78rem; }
.deco-item .row { display: flex; gap: 6px; }
.deco-item button { font-size: .8rem; padding: 5px 9px; border-radius: 10px; border-width: 2px; box-shadow: 0 2px 0 var(--ink); }
.deco-item .buy { background: var(--butter); } .deco-item .put { background: var(--mint); }
.tabs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.tabs button { font-size: .85rem; padding: 6px 10px; border-radius: 12px; border-width: 2px; box-shadow: 0 2px 0 var(--ink); background: var(--card); }
.tabs button[aria-pressed="true"] { background: var(--peach); }
.book-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 52vh; overflow-y: auto; padding: 2px; }
.book-grid .friend svg { width: 72px; height: 72px; }
.book-grid .unknown svg { opacity: .35; filter: grayscale(1); }
.fishing { display: flex; flex-direction: column; gap: 12px; }
.fishing svg { width: 100%; max-width: 260px; height: auto; margin: 0 auto; display: block; border-radius: 16px; border: 2px solid var(--ink); }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
@keyframes bite { 0%,100% { transform: translateY(0); } 30% { transform: translateY(9px); } 60% { transform: translateY(4px); } }
#bobber { animation: float 1.6s ease-in-out infinite; transform-box: fill-box; }
#bobber.bite { animation: bite .35s ease-in-out infinite; }
.decos-remove .deco { cursor: pointer; }
.mapnav { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-top: -4px; }
.mapnav button { font-size: .76rem; padding: 4px 8px; border-radius: 999px; border-width: 2px; box-shadow: 0 2px 0 var(--ink); background: var(--card); }
.mapnav button[aria-current="true"] { background: var(--peach); }
.modal.wide { max-width: 470px; max-height: 94vh; overflow-y: auto; }
.room-wrap svg { width: 100%; height: auto; display: block; border-radius: 14px; border: 2px solid var(--ink); }
.room-btns, .chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.room-btns button, .chips button { font-size: .85rem; padding: 6px 11px; border-radius: 12px; border-width: 2px; box-shadow: 0 2px 0 var(--ink); background: var(--butter); }
.room-btns button[aria-pressed="true"], .chips button[aria-pressed="true"] { background: var(--peach); }
.chips button { display: flex; flex-direction: column; align-items: center; background: var(--card); padding: 4px 8px; }
.chips svg { width: 42px; height: 46px; }
.furn-rm .furn { cursor: pointer; }
.furn-rm .furn:hover { opacity: .65; }
.decos-remove .deco:hover { opacity: .7; }
button {
  font-family: var(--font-body); font-weight: 700; font-size: 1.05rem; color: var(--ink);
  border: 2.5px solid var(--ink); border-radius: 16px; padding: 12px 14px; cursor: pointer;
  box-shadow: 0 3px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
button:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
button:focus-visible { outline: 3px solid #5b9bd5; outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; transform: none; box-shadow: 0 3px 0 var(--ink); }
#sell { background: var(--strawberry); color: #fff; text-shadow: 0 1px 0 rgba(74,59,51,.35); }
#friends { background: var(--butter); }

.toast {
  z-index: 4;
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
  background: var(--card); border: 2px solid var(--ink); border-radius: 14px;
  padding: 6px 14px; font-weight: 700; font-size: .95rem; white-space: nowrap; max-width: 92%;
  overflow: hidden; text-overflow: ellipsis; pointer-events: none;
  opacity: 0; transition: opacity .25s, transform .25s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(2px); }

.modal-back {
  position: fixed; inset: 0; background: rgba(74,59,51,.35); display: flex;
  align-items: center; justify-content: center; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.modal-back[hidden] { display: none; }
.modal {
  background: var(--card); border: 2.5px solid var(--ink); border-radius: 22px; padding: 18px;
  width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; text-align: center;
  box-shadow: 0 5px 0 rgba(74,59,51,.25);
}
.modal h2 { font-family: var(--font-title); font-weight: 400; font-size: 1.4rem; margin: 0; }
.modal p { margin: 0; line-height: 1.6; }
.modal .say { background: #fff1f4; border-radius: 14px; padding: 10px 12px; }
.modal svg.portrait { width: 140px; height: 140px; margin: 0 auto; display: block; }
.modal .primary { background: var(--strawberry); color: #fff; }
.modal .plain { background: var(--card); }
.friend-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.friend { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .85rem; }
.friend svg { width: 76px; height: 76px; background: #f3f8e6; border-radius: 16px; border: 2px solid var(--ink); }
.friend b { font-size: .95rem; }
.friend .role { color: var(--ink-soft); min-height: 2.4em; }
.sell-list { display: flex; flex-direction: column; gap: 8px; text-align: left; }
.sell-row { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; background: #f7f3ea; border-radius: 14px; padding: 8px 10px; }
.sell-row svg { width: 36px; height: 36px; }
.sell-row .nm { min-width: 0; line-height: 1.3; }
.sell-row .nm small { display: block; color: var(--ink-soft); font-size: .8rem; font-variant-numeric: tabular-nums; }
.sell-row button { font-size: .92rem; padding: 8px 12px; background: var(--strawberry); color: #fff; border-radius: 12px; }
.modal .note { font-size: .85rem; color: var(--ink-soft); }
.chip[hidden] { display: none; }
.foot { text-align: center; font-size: .78rem; color: var(--ink-soft); }
.foot button { font-size: .78rem; padding: 4px 10px; border-width: 1.5px; box-shadow: none; background: transparent; border-radius: 10px; }

@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes squish { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.05,.93); } }
@keyframes hop { 0%,70%,100% { transform: translateY(0); } 80% { transform: translateY(-7px); } 90% { transform: translateY(0); } }
@keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
@keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
@keyframes cloud { from { transform: translateX(-80px); } to { transform: translateX(1840px); } }
@keyframes swim { from { transform: translateX(90px); } to { transform: translateX(-130px); } }
.swim { animation: swim 12s linear infinite; }
.bob { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; }
.squish { animation: squish 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.hop { animation: hop 3.2s ease-in-out infinite; transform-box: fill-box; }
.sway { animation: sway 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.twinkle { animation: twinkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.cloud { animation: cloud 240s linear infinite; }
/* friends' little faces: blink, glance around, ^^ when happy, wag tails and ears */
@keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
@keyframes look { 0%, 30%, 100% { transform: translateX(0); } 38%, 52% { transform: translateX(1.1px); } 60%, 74% { transform: translateX(-1px); } }
@keyframes wag { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(11deg); } }
@keyframes tuft { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(10deg); } }
@keyframes flap { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-22deg); } 86% { transform: rotate(4deg); } 92% { transform: rotate(-14deg); } }
@keyframes earL { 0%, 78%, 100% { transform: rotate(0); } 84% { transform: rotate(-12deg); } 90% { transform: rotate(5deg); } }
@keyframes earR { 0%, 60%, 100% { transform: rotate(0); } 66% { transform: rotate(12deg); } 72% { transform: rotate(-5deg); } }
@keyframes joyjump { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-8px) scale(1.04, .96); } }
@keyframes emote { 0% { opacity: 0; transform: translateY(4px) scale(.5); } 20% { opacity: 1; transform: translateY(0) scale(1.1); } 75% { opacity: 1; transform: translateY(-7px) scale(1); } 100% { opacity: 0; transform: translateY(-12px); } }
.eye { animation: look 11s ease-in-out infinite; }
.eye .open { animation: blink 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.joy { opacity: 0; }
.happy .joy { opacity: 1; } .happy .open { opacity: 0; }
.happy > .hop, .happy > .squish { animation: joyjump .45s ease-in-out 2 !important; }
.tail { animation: wag 1.6s ease-in-out infinite; }
.tuft { animation: tuft 2.6s ease-in-out infinite; }
.wing { animation: flap 3.4s ease-in-out infinite; }
.ear-l { animation: earL 4.2s ease-in-out infinite; }
.ear-r { animation: earR 4.2s ease-in-out infinite; }
.emote { pointer-events: none; }
.emote-in { animation: emote 1.7s ease-out forwards; transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) {
  .eye, .eye .open, .tail, .tuft, .wing, .ear-l, .ear-r, .happy > .hop, .happy > .squish { animation: none !important; }
  .bob, .squish, .hop, .sway, .twinkle, .cloud, .swim, .chip.pop, #panR.nudge { animation: none; }
  .twinkle { opacity: 1; }
}
</style>

<div class="app">
  <header>
    <h1 aria-label="コケと ねこうさひろば"><svg id="logoKoke" viewBox="-24 -22 48 40" aria-hidden="true"></svg><span class="kk">コケと</span><span class="ne">ねこ</span><span class="u">うさ</span><span class="h">ひろば</span></h1>
    <div class="hud">
      <div class="chip" id="coinChip" aria-label="コイン">
        <svg viewBox="-12 -12 24 24" aria-hidden="true"><circle r="10" fill="#ffd45e" stroke="#4a3b33" stroke-width="1.8"/><circle r="6.5" fill="none" stroke="#e0a92e" stroke-width="1.4"/><path d="M-2,-3 L0,-5 L2,-3 M0,-5 V5" stroke="#b07b12" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        <span id="coins">0</span>
      </div>
      <div class="chip" id="stockChip" aria-label="いちご">
        <svg viewBox="-12 -12 24 24" aria-hidden="true"><use href="#berry" transform="scale(1.35) translate(0,1)"/></svg>
        <span id="stock">0</span>
      </div>
      <div class="chip" id="appleChip" aria-label="りんご" hidden>
        <svg viewBox="-12 -12 24 24" aria-hidden="true"><use href="#apple" transform="scale(1.35) translate(0,1)"/></svg>
        <span id="apples">0</span>
      </div>
      <div class="chip" id="grapeChip" aria-label="ぶどう" hidden>
        <svg viewBox="-12 -12 24 24" aria-hidden="true"><use href="#grape" transform="scale(1.3) translate(0,1.5)"/></svg>
        <span id="grapes">0</span>
      </div>
      <div class="chip" id="fishChip" aria-label="さかな" hidden>
        <svg viewBox="-12 -12 24 24" aria-hidden="true"><use href="#fish" fill="#9cc9e8" transform="scale(1.05)"/></svg>
        <span id="fishN">0</span>
      </div>
      <div class="chip" id="eggChip" aria-label="たまご" hidden>
        <svg viewBox="-12 -12 24 24" aria-hidden="true"><use href="#egg" transform="scale(1.45)"/></svg>
        <span id="eggs">0</span>
      </div>
      <div class="chip" id="cakeChip" aria-label="いちごケーキ" hidden>
        <svg viewBox="-12 -12 24 24" aria-hidden="true"><use href="#cake" transform="scale(1.2) translate(0,1)"/></svg>
        <span id="cakes">0</span>
      </div>
    </div>
  </header>

  <div class="scene-wrap">
    <div class="scroller" id="scroller">
    <svg id="scene" viewBox="0 0 1800 640" role="img" aria-label="ねこうさひろばの むら">
      <defs>
        <g id="berry">
          <path d="M0,-4.5 C5.5,-5 6.5,0.5 0,7.5 C-6.5,0.5 -5.5,-5 0,-4.5Z" fill="#ef5b6b" stroke="#4a3b33" stroke-width="1"/>
          <path d="M-4,-4.5 L-1.5,-3 L0,-6.5 L1.5,-3 L4,-4.5 L2.5,-2 L-2.5,-2Z" fill="#7cc46a" stroke="#4a3b33" stroke-width=".8" stroke-linejoin="round"/>
          <circle cx="-1.8" cy="0" r=".55" fill="#ffe9a0"/><circle cx="1.8" cy="0.4" r=".55" fill="#ffe9a0"/><circle cx="0" cy="3" r=".55" fill="#ffe9a0"/>

  // ---------- plots ----------
  function plotSvg(p, i) {
    const c = i % COLS, r = Math.floor(i / COLS);

    const cx = x + PW / 2, cy = y + PH / 2;
    if (!p.open) {
      const isNext = S.plots.findIndex(q => !q.open) === i;
      if (!isNext) return `<g><rect x="${x}" y="${y}" width="${PW}" height="${PH}" rx="12" fill="#c4dd97" opacity=".55"/></g>`;

  // ---------- render ----------

    playUntil = Date.now() + 20000;

    const who = ['sakura', 'tonsuke', 'shirousa', 'chausa'].filter(k => S[k] === 'friend' && !away(k));

    if (ds !== decoSig) { decoSig = ds; $('decos').innerHTML = S.decos.map((d, i) => `<g class="deco" data-deco="${i}" transform="translate(${d.x},${d.y}) scale(1.4)">${decoSvg(d.k)}</g>`).join(''); }
    renderOrders();
    $('fishChip').hidden = !S.pond.owned; $('fishN').textContent = FISH.reduce((t, f) => t + (f.price ? S[f.k] || 0 : 0), 0);
    $('appleChip').hidden = !S.orchard.owned; $('apples').textContent = S.appleStock;
    $('grapeChip').hidden = !S.orchard.owned; $('grapes').textContent = S.grapeStock;
    $('coins').textContent = S.coins;
    $('stock').textContent = S.stock;
    $('eggChip').hidden = !S.coop.owned; $('eggs').textContent = S.eggStock;
    $('cakeChip').hidden = !S.bakery.owned; $('cakes').textContent = S.cakes;
    const sell = $('sell');
    const total = Object.keys(GOODS).reduce((t, k) => t + (S[k] || 0) * GOODS[k].unit(), 0);
    sell.disabled = total === 0;
    $('sellAmt').hidden = !total; $('sellAmt').textContent = `+${total}`;
    const ready = S.orders.filter(canFill).length, on = $('orderN');
    questDay();
    const qn = questReady(), qb = $('questN'); qb.hidden = !qn; qb.textContent = qn;
    const tb = $('trainN'), cars = S.train?.cars, loadable = cars ? cars.filter(c => !c.done && (S[c.k] || 0) >= c.n).length : 0;
    tb.hidden = !cars; tb.textContent = loadable ? `${loadable}こ OK` : 'きたよ'; tb.classList.toggle('ready', loadable > 0);
    on.hidden = !S.orders.length; on.textContent = ready ? `${ready}こ OK` : S.orders.length; on.classList.toggle('ready', ready > 0);
    // fruit on the stand grows with stock
    const n = Math.min(S.stock, 12);
    if (n !== standSig) { standSig = n;
    let f = '';
    for (let k = 0; k < n; k++) f += `<use href="#berry" transform="translate(${126 + k * 9.5},${184 - (k % 2) * 3}) scale(1.05)"/>`;
    $('standFruit').innerHTML = f; }
    if (Date.now() > playUntil) pickPlay();
    const castKey = [S.sakura, S.tonsuke, S.shirousa, S.chausa, playWho, playIdx, ...(S.homes.sakura?.guests || [])].join();
    if (castSig !== castKey) { castSig = castKey;
    // friends invited to さくらの おうち are inside, so they are not drawn outside
    let cast = away('koke') ? '' : `<g transform="translate(272,217)" class="tap" id="kokeTap" role="button" tabindex="0" aria-label="コケ"><g class="squish">${koke()}</g></g>`;
    const playing = (who) => playWho === who && S.decos[playIdx];
    const at = (who, def) => { const d = playing(who); return d ? `translate(${d.x + 12},${d.y - 6}) scale(.75)` : def; };
    if (S.sakura === 'friend') cast += `<g transform="${at('sakura', 'translate(58,224)')}" class="tap" id="sakuraTap" role="button" tabindex="0" aria-label="さくら"><g class="hop">${sakura()}</g></g>`;
    else if (S.sakura === 'visiting') cast += `<g transform="translate(340,214) scale(.8)" opacity=".9"><g class="hop">${sakura()}</g></g>`;
    if (S.tonsuke === 'friend') { if (!away('tonsuke')) cast += `<g transform="${at('tonsuke', 'translate(150,228) scale(.9)')}" class="tap" id="tonTap" role="button" tabindex="0" aria-label="とんすけ"><g class="squish">${tonsuke()}</g></g>`; }
    else if (S.tonsuke === 'visiting') cast += `<g transform="translate(20,232) scale(.75)" opacity=".9"><g class="squish">${tonsuke()}</g></g>`;
    if (S.shirousa === 'friend') { if (!away('shirousa')) cast += `<g transform="${at('shirousa', 'translate(1190,228)')}" class="tap" id="shiroTap" role="button" tabindex="0" aria-label="しろうさ"><g class="hop">${shirousa()}</g></g>`; }
    else if (S.shirousa === 'visiting') cast += `<g transform="translate(1420,228) scale(.8)" opacity=".9"><g class="hop">${shirousa()}</g></g>`;
    if (S.chausa === 'friend') { if (!away('chausa')) cast += `<g transform="${at('chausa', 'translate(1340,230)')}" class="tap" id="chaTap" role="button" tabindex="0" aria-label="ちゃうさ"><g class="squish">${chausa()}</g></g>`; }
    else if (S.chausa === 'visiting') cast += `<g transform="translate(1420,232) scale(.8)" opacity=".9"><g class="squish">${chausa()}</g></g>`;
    $('cast').innerHTML = cast; }
    $('hint').textContent = hint();
  }

  function hint() {
    const open = S.plots.filter(p => p.open);
    const bl = bakeLeft();
    if (bl != null && bl <= 0) return 'ケーキが やけたよ！にゃんケーキを タップして うけとろう';
    if (open.some(p => progress(p) >= 1)) return 'いちごが あかくなったよ！タップして しゅうかくしよう';
    const ripeTree = [...S.orchard.apples.map(t => treeProg(t, 'a')), ...S.orchard.grapes.map(t => treeProg(t, 'g'))].some(p => p >= 1);
    if (ripeTree) return 'かじゅえんの くだものが みのったよ！「かじゅえん」へ いって しゅうかくしよう';
    if (S.coop.eggs > 0) return 'にわとりごやに たまごが あるよ。タップして あつめよう';
    if (S.bakery.owned && bl == null && canBake()) return `にゃんケーキを タップして いちごケーキを やこう（いちご${CAKE_BERRIES}こ＋たまご${CAKE_EGGS}こ）`;
    if (!S.coop.owned && S.coins >= COOP_PRICE) return `${COOP_PRICE}コインで にわとりごやが たてられるよ（みぎの おみせどおり）`;
    if (S.coop.owned && !S.bakery.owned && S.coins >= BAKERY_PRICE) return `${BAKERY_PRICE}コインで にゃんケーキが たてられるよ（おみせどおり）`;
    const hk = Object.keys(HOMES).find(k => S[k] === 'friend' && !S.homes[k]);
    if (hk && S.coins >= HOMES[hk].price) return `${HOMES[hk].price}コインで ${HOMES[hk].name}の おうちが たてられるよ（おうちの まち）`;
    if (S.train?.cars?.some(c => !c.done && (S[c.k] || 0) >= c.n)) return 'れっしゃに つめる ものが あるよ！「れっしゃ」を おしてね';
    if (questReady()) return 'おねがいが かなったよ！「おねがい」で ごほうびを うけとろう';
    if (S.orders.some(canFill)) return 'ちゅうもんの ものが そろったよ！したの「とどける」を おしてね';
    if (S.orchard.owned && !S.pond.owned && S.coins >= POND_PRICE) return `${POND_PRICE}コインで いけの ある とちが かえるよ（したの「いけ」）`;
    if (!S.orchard.owned && S.coins >= LAND_PRICE) return `${LAND_PRICE}コインで かじゅえんの とちが かえるよ（したの「かじゅえん」）`;
    if (S.cakes > 0) return 'ケーキは 1こ ' + CAKE_PRICE + 'コインで うれるよ。「うる」ボタンから どうぞ';
    if (S.stock > 0) return S.coop.owned ? '「うる」ボタンで いちごや たまごを うろう' : 'くだものやさんを タップするか、ボタンで いちごを うろう';
    if (open.some(p => p.at == null)) return S.coins >= SEED_COST
      ? `あいている はたけを タップして たねを まこう（${SEED_COST}コイン）`
      : 'コインが たりないよ。いちごが そだつのを まとう';
    const cost = nextPlotPrice();
    if (cost && S.coins >= cost) return `${cost}コインで はたけを ふやせるよ（＋のマス）`;
    const left = Math.min(...open.map(p => growMs() - (Date.now() - p.at)));
    return `いちごが そだっているよ。あと ${fmt(left)}`;
  }
  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000)), m = Math.floor(s / 60);
    return m ? `${m}ふん${String(s % 60).padStart(2, '0')}びょう` : `${s}びょう`;
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function pop(id) { const el = $(id); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

  // ---------- actions ----------
  function tapPlot(i) {
    const p = S.plots[i];
    if (!p.open) {
      const cost = nextPlotPrice();
      if (S.coins < cost) { toast(`あと ${cost - S.coins}コイン で ふやせるよ`); return; }
      S.coins -= cost; p.open = true; toast('はたけが ひろがった！'); pop('coinChip');
      if (S.tonsuke === 'none' && S.plots.filter(q => q.open).length >= TONSUKE_AFTER_PLOTS) { S.tonsuke = 'visiting'; setTimeout(showTonVisit, 900); }
    } else if (p.at == null) {
      if (S.coins < SEED_COST) { toast('コインが たりないよ'); return; }
      S.coins -= SEED_COST; p.at = Date.now(); toast('いちごの たねを まいたよ'); pop('coinChip');
    } else if (progress(p) >= 1) {
      p.at = null; S.stock += BERRIES_PER_HARVEST; see('stock'); qAdd('berry', BERRIES_PER_HARVEST); toast(`いちごを ${BERRIES_PER_HARVEST}こ しゅうかく！`); pop('stockChip');
    } else {
      toast(`あと ${fmt(growMs() - (Date.now() - p.at))} で みのるよ`); return;
    }
    save(); render();
  }

  function tapCoop() {
    const c = S.coop;
    if (!c.owned) {
      if (S.coins < COOP_PRICE) { toast(`にわとりごやは ${COOP_PRICE}コイン。あと ${COOP_PRICE - S.coins}コイン`); return; }
      S.coins -= COOP_PRICE; c.owned = true; c.hens = 1; c.eggs = 0; c.last = Date.now();
      pop('coinChip'); save(); render();
      openModal(`<h2>にわとりごやが できた！</h2>
        <svg class="portrait" viewBox="-20 -20 40 36" aria-hidden="true">${hen()}</svg>
        <p>にわとりが ${Math.round(EGG_MS / 60000) || 1}ふんに 1こ たまごを うむよ。<br>たまごは にわとりごやを タップして あつめてね。</p>
        <button class="plain" type="button" id="ok3">わかった！</button>`);
      $('ok3').addEventListener('click', closeModal);
      return;
    }
    if (c.eggs > 0) {
      const n = c.eggs; S.eggStock += n; see('eggStock'); qAdd('egg', n); c.eggs = 0; c.last = Date.now();
      toast(`たまごを ${n}こ あつめたよ`); pop('eggChip'); save(); render(); return;
    }
    const next = HEN_PRICES[c.hens - 1];
    openModal(`<h2>にわとりごや</h2>
      <svg class="portrait" viewBox="-20 -20 40 36" aria-hidden="true">${hen()}</svg>
      <p>にわとり：${c.hens}わ<br>つぎの たまごまで あと ${fmt(eggLeft())}</p>
      ${next ? `<button class="primary" type="button" id="buyHen" ${S.coins < next ? 'disabled' : ''}>にわとりを ふやす（${next}コイン）</button>` : '<p class="note">にわとりごやは いっぱいだよ</p>'}
      <button class="plain" type="button" id="close2">とじる</button>`);
    $('close2').addEventListener('click', closeModal);
    $('buyHen')?.addEventListener('click', () => {
      if (S.coins < next) return;
      S.coins -= next; c.hens += 1; pop('coinChip'); save(); render(); closeModal(); toast('にわとりが ふえたよ！');
    });
  }

  function tapBakery() {
    const b = S.bakery;
    if (!b.owned) {
      if (!S.coop.owned) { toast('さきに にわとりごやを たてよう'); return; }
      if (S.coins < BAKERY_PRICE) { toast(`にゃんケーキは ${BAKERY_PRICE}コイン。あと ${BAKERY_PRICE - S.coins}コイン`); return; }
      S.coins -= BAKERY_PRICE; b.owned = true; pop('coinChip'); save(); render();
      openModal(`<h2>にゃんケーキ かいてん！</h2>
        <svg class="portrait" viewBox="-12 -12 24 22" aria-hidden="true"><use href="#cake"/></svg>
        <p>いちご ${CAKE_BERRIES}こ と たまご ${CAKE_EGGS}こ で、ねこの いちごケーキが やけるよ。<br>ケーキは 1こ ${CAKE_PRICE}コインで うれるよ。</p>
        <button class="plain" type="button" id="ok4">やいてみる！</button>`);
      $('ok4').addEventListener('click', closeModal);
      return;
    }
    const left = bakeLeft();
    if (left != null && left <= 0) { b.at = null; S.cakes += 1; see('cakes'); qAdd('cake', 1); toast('いちごケーキが やけた！'); pop('cakeChip'); save(); render(); return; }
    if (left != null) { toast(`ケーキが やけるまで あと ${fmt(left)}`); return; }
    if (!canBake()) { toast(`いちご ${CAKE_BERRIES}こ と たまご ${CAKE_EGGS}こ で やけるよ`); return; }
    S.stock -= CAKE_BERRIES; S.eggStock -= CAKE_EGGS; b.at = Date.now();
    toast('ケーキを やきはじめたよ'); save(); render();
  }

  function tapLand() {
    if (S.coins < LAND_PRICE) { toast(`となりの とちは ${LAND_PRICE}コイン。あと ${LAND_PRICE - S.coins}コイン`); return; }
    S.coins -= LAND_PRICE; S.orchard.owned = true; pop('coinChip'); save(); render();
    openModal(`<h2>かじゅえんが できた！</h2>
      <svg class="portrait" viewBox="-14 -12 28 22" aria-hidden="true"><use href="#apple" transform="translate(-6,0)"/><use href="#grape" transform="translate(7,0)"/></svg>
      <p>りんごの なえ（${APPLE_TREE}コイン）や ぶどうの なえ（${GRAPE_VINE}コイン）を うえよう。<br>いちど うえたら、しゅうかく しても また みのるよ。</p>
      <button class="plain" type="button" id="ok5">うえてみる！</button>`);
    $('ok5').addEventListener('click', () => {
      closeModal();
      if (S.shirousa === 'none') { S.shirousa = 'visiting'; save(); render(); setTimeout(() => showRabbitVisit('shirousa'), 500); }
    });
  }
  function tapTree(code) {
    const kind = code[0], t = slotOf(code);
    const cost = kind === 'a' ? APPLE_TREE : GRAPE_VINE, name = kind === 'a' ? 'りんご' : 'ぶどう';
    if (!t.p) {
      if (S.coins < cost) { toast(`${name}の なえは ${cost}コイン。あと ${cost - S.coins}コイン`); return; }
      S.coins -= cost; t.p = true; t.at = Date.now(); pop('coinChip'); toast(`${name}の なえを うえたよ`);
    } else if (treeProg(t, kind) >= 1) {
      const n = kind === 'a' ? APPLE_YIELD : GRAPE_YIELD;
      if (kind === 'a') { S.appleStock += n; see('appleStock'); pop('appleChip'); qAdd('apple', n); } else { S.grapeStock += n; see('grapeStock'); pop('grapeChip'); qAdd('grape', n); }
      t.at = Date.now(); toast(`${name}を ${n}こ しゅうかく！`);
      if (kind === 'g' && S.chausa === 'none') { S.chausa = 'visiting'; setTimeout(() => showRabbitVisit('chausa'), 900); }
    } else {
      toast(`${name}が みのるまで あと ${fmt(treeMs(kind) - (Date.now() - t.at))}`); return;
    }
    save(); render();
  }

  function sellButton() {
    if (!S.coop.owned && !S.orchard.owned && !S.pond.owned) return sellAll();
    showSell();
  }
  function showSell() {
    const rows = Object.entries(GOODS).filter(([, g]) => g.on()).map(([k, g]) => ({ k, name: g.name, icon: g.icon, unit: g.unit() }));
    const html = rows.map(r => `<div class="sell-row"><svg viewBox="-12 -12 24 24" aria-hidden="true">${r.icon}</svg>
      <div class="nm"><b>${r.name}</b><small>${S[r.k]}こ × ${r.unit}コイン</small></div>
      <button type="button" data-sell="${r.k}" ${S[r.k] ? '' : 'disabled'}>うる +${S[r.k] * r.unit}</button></div>`).join('');
    openModal(`<h2>うる</h2><div class="sell-list" style="max-height:52vh;overflow-y:auto">${html}</div>
      ${S.bakery.owned ? `<p class="note">ケーキには いちご${CAKE_BERRIES}こ と たまご${CAKE_EGGS}こ を つかうよ。のこして おこう</p>` : ''}
      <button class="plain" type="button" id="close3">とじる</button>`);
    $('close3').addEventListener('click', closeModal);
    $('modal').querySelectorAll('[data-sell]').forEach(btn => btn.addEventListener('click', () => {
      const k = btn.dataset.sell, row = rows.find(r => r.k === k);
      if (k === 'stock') sellAll();
      else { const earn = S[k] * row.unit; S.coins += earn; qAdd('sell', earn); S[k] = 0; pop('coinChip'); toast(`+${earn}コイン！`); save(); render(); }
      if (anyVisiting()) return;
      showSell();
    }));
  }

  function sellAll() {
    if (!S.stock) { toast('うる いちごが ないよ'); return; }
    const earn = S.stock * price();
    S.totalSold += S.stock; S.coins += earn; qAdd('sell', earn); S.stock = 0;
    toast(S.sakura === 'friend' ? `さくらが うってくれたよ　+${earn}コイン` : `+${earn}コイン！`);
    pop('coinChip');
    if (S.sakura === 'none' && S.totalSold >= SAKURA_AFTER_SOLD) { S.sakura = 'visiting'; setTimeout(showVisit, 900); }
    save(); render();
  }

  const RABBITS = {
    shirousa: { name: 'しろうさ', draw: () => shirousa(),

      skill: '<b>かじゅえんの おせわ</b> が とくい。<br>りんごと ぶどうが すこし はやく みのるように なったよ。' },
    chausa: { name: 'ちゃうさ', draw: () => chausa(),

  function showFriends() {

  // ---------- orders ----------
  const canFill = (o) => o.want.every(([k, n]) => (S[k] || 0) >= n);
  function makeOrder() {
    const pool = ['stock', 'eggStock', 'appleStock', 'grapeStock', 'cakes'].filter(k => GOODS[k].on());
    const qty = { stock: [3, 8], eggStock: [1, 3], appleStock: [2, 5], grapeStock: [1, 3], cakes: [1, 2] };
    const n = pool.length > 1 && Math.random() < .5 ? 2 : 1;
    const picks = [...pool].sort(() => Math.random() - .5).slice(0, n);
    const want = picks.map(k => [k, qty[k][0] + Math.floor(Math.random() * (qty[k][1] - qty[k][0] + 1))]);
    const value = want.reduce((t, [k, q]) => t + q * GOODS[k].unit(), 0);
    const c = CUSTOMERS[Math.floor(Math.random() * CUSTOMERS.length)];
    return { c: c.k, want, reward: Math.round(value * 1.5 / 5) * 5 + 5 };
  }
  function tickOrders() {
    if (S.orders.length >= MAX_ORDERS || Date.now() < S.nextOrderAt) return false;

    return true;
  }
  function renderOrders() {

    const sig = JSON.stringify(S.orders) + Object.keys(GOODS).map(k => S[k]).join();
    if (sig === orderSig) { const w = $('orderWait'); if (w) w.textContent = waitText; return; }
    orderSig = sig;
    const cards = S.orders.map((o, i) => {
      const who = CUSTOMERS.find(c => c.k === o.c);
      const want = o.want.map(([k, n]) => `<span class="${(S[k] || 0) >= n ? '' : 'short'}"><svg viewBox="-12 -12 24 24" aria-hidden="true">${GOODS[k].icon}</svg>${Math.min(S[k] || 0, n)}/${n}</span>`).join('');
      return `<div class="order"><svg class="face" viewBox="-20 -24 40 40" aria-hidden="true">${customerSvg(o.c)}</svg>
        <div><div class="who">${who.name}</div><div class="want">${want}</div></div>
        <div class="side"><span class="reward">+${o.reward}コイン</span>

  let fishTimer = null, fishState = 'idle', fishRaf = 0, hooked = null, tries = 0, zoneAt = 0, fishPos = 0;

  function fishAction() {
    const msg = $('fishMsg'), btn = $('fishBtn'), bob = $('bobber');
    if (fishState === 'idle') {
      if (S.coins < BAIT) { msg.textContent = 'コインが たりないよ'; return; }
      S.coins -= BAIT; save(); render();
      $('catch').innerHTML = ''; $('gauge').setAttribute('opacity', '0');
      bob.setAttribute('opacity', '1'); $('line').setAttribute('opacity', '1'); bob.classList.remove('bite');
      fishState = 'wait'; msg.textContent = 'ウキを みていてね…'; btn.textContent = 'ひく！';
      fishTimer = setTimeout(() => {
        hooked = pickFish(); fishState = 'bite'; bob.classList.add('bite');
        msg.textContent = hooked.zone < .22 ? 'ぐぐっ！ おもいぞ… いまだ！' : 'いまだ！ ひいてる！';
        fishTimer = setTimeout(() => { if (fishState === 'bite') endFish('にげられちゃった… もういちど！'); }, FAST ? 1500 : 1300);
      }, 1500 + Math.random() * 2500);
    } else if (fishState === 'wait') {
      clearTimeout(fishTimer); endFish('はやすぎた… さかなが にげちゃった');
    } else if (fishState === 'bite') {
      clearTimeout(fishTimer); startReel();
    } else if (fishState === 'reel') {
      if (fishPos >= zoneAt - .01 && fishPos <= zoneAt + hooked.zone + .01) { stopFish(); landFish(hooked); }
      else if (++tries < 2) msg.textContent = 'おしい！ もういちど みどりで「いまだ！」';

  function startReel() {

  // ---------- houses ----------

  function tapHome(key) {

  // ---------- きょうの おねがい (daily quests) ----------
  function questGen() {
    const pool = QUESTS.filter(q => q.on()).sort(() => Math.random() - .5).slice(0, 3);
    const askers = ['koke', ...['sakura', 'tonsuke', 'shirousa', 'chausa'].filter(k => S[k] === 'friend')];
    return pool.map(q => {
      let n = q.n[0] + Math.floor(Math.random() * (q.n[1] - q.n[0] + 1));
      if (q.step) n = Math.round(n / q.step) * q.step;
      return { t: q.t, n, got: 0, claimed: false, who: askers[Math.floor(Math.random() * askers.length)], reward: Math.max(10, Math.round(q.r(n) / 5) * 5) };
    });
  }
  function questDay() {
    const d = new Date().toDateString();

  }
  function qAdd(t, n) {
    questDay();
    S.quest.list.forEach(q => { if (q.t === t && !q.claimed) q.got = Math.min(q.n, q.got + n); });
  }
  const questReady = () => !S.quest ? 0 : S.quest.list.filter(q => !q.claimed && q.got >= q.n).length + (S.quest.list.every(q => q.claimed) && !S.quest.bonus ? 1 : 0);

  // ---------- れっしゃ (train) ----------
  function tickTrain() {
    if (!S.coop.owned || S.train.cars || Date.now() < S.train.next) return false;
    const pool = ['stock', 'eggStock', 'appleStock', 'grapeStock', 'cakes', 'fishS'].filter(k => GOODS[k].on());
    const qty = { stock: [6, 12], eggStock: [3, 6], appleStock: [4, 8], grapeStock: [3, 6], cakes: [2, 3], fishS: [2, 4] };
    S.train.cars = [0, 1, 2].map(() => {
      const k = pool[Math.floor(Math.random() * pool.length)], n = qty[k][0] + Math.floor(Math.random() * (qty[k][1] - qty[k][0] + 1));
      return { k, n, done: false, reward: Math.round(n * GOODS[k].unit() * 1.6 / 5) * 5 + 5 };
    });
    return true;
  }

  }, 1000);

  if (tickEggs() | tickOrders() | tickTrain()) save();
  $('decos').style.pointerEvents = 'none';
  $('logoKoke').innerHTML = `<g class="squish">${koke()}</g>`;
  render(); panState();
  if (S.sakura === 'visiting') setTimeout(showVisit, 600);
  else if (S.tonsuke === 'visiting') setTimeout(showTonVisit, 600);
  else if (S.shirousa === 'visiting') setTimeout(() => showRabbitVisit('shirousa'), 600);
  else if (S.chausa === 'visiting') setTimeout(() => showRabbitVisit('chausa'), 600);
  const ripe = S.plots.filter(p => p.open && progress(p) >= 1).length;
  if (ripe && S.totalSold + S.stock > 0) toast(`おかえり！いちごが ${ripe}マス みのっているよ`);
  else if (!S.totalSold && S.plots.every(p => p.at == null)) toast('ようこそ、ねこうさひろばへ！ コケと いっしょに はじめよう');
})();
</script>
